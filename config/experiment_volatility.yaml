experiment:
  target: "volatility"
  models:
    - name: "logistic_regression"
      params:
        C: 1.0
        max_iter: 1000
        # Deliberate drift from the direction grid (which runs unweighted):
        # the volatility target is ~50/50 by construction, so balancing is
        # near-neutral; results across the two grids are not model-comparable.
        class_weight: "balanced"
    - name: "lightgbm"
      params:
        n_estimators: 200
        max_depth: 5
        learning_rate: 0.05
        num_leaves: 31
        # Deliberate drift from the direction grid (which runs unweighted):
        # the volatility target is ~50/50 by construction, so balancing is
        # near-neutral; results across the two grids are not model-comparable.
        class_weight: "balanced"
        verbosity: -1

  imputers:
    - name: "forward_fill"
      params: {}
    - name: "median"
      params: {}
    - name: "iterative"
      params:
        max_iter: 50
        random_state: 42
    - name: "drop"
      params: {}

  calibrators:
    - name: "none"
      params: {}
    - name: "platt"
      params: {}
    - name: "isotonic"
      params: {}

  missingness:
    # MCAR-BLOCK-MARKET: whole-market outage days shared across tickers.
    # MNAR: masking driven by the feature's own value (volatility_20d via
    # config/missingness.yaml). Both implemented in src/calibmiss/missingness.py.
    mechanisms: ["MCAR", "MCAR-BLOCK", "MAR", "MNAR", "MCAR-BLOCK-MARKET"]
    rates: [0.0, 0.1, 0.2, 0.3]
    seeds: [42, 123, 456, 789, 999]

  splits:
    train_years: 3
    calibrate_months: 6
    test_months: 6
    roll_forward_months: 6
    purge_days: 60

  evaluation:
    n_bins_ece: 10
    metrics: ["brier", "ece", "roc_auc"]
