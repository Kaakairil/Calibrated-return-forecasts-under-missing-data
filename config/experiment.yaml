experiment:
  models:
    - name: "logistic_regression"
      params:
        C: 1.0
        max_iter: 1000
    - name: "lightgbm"
      params:
        n_estimators: 200
        max_depth: 5
        learning_rate: 0.05
        num_leaves: 31
        verbosity: -1

  imputers:
    - name: "forward_fill"
      params: {}
    - name: "median"
      params: {}
    - name: "iterative"
      params:
        max_iter: 50
        random_state: 42
    - name: "drop"
      params: {}

  calibrators:
    - name: "none"
      params: {}
    - name: "platt"
      params: {}
    - name: "isotonic"
      params: {}

  missingness:
    # Implemented in src/calibmiss/missingness.py but not yet in the committed
    # grid runs: MCAR-BLOCK-MARKET (whole-market day blocks) and MNAR
    # (masking driven by the feature values themselves). Adding either expands
    # the grid by one mechanism slice (~5h at n_jobs=1); results in results/
    # cover the three mechanisms listed below only.
    mechanisms: ["MCAR", "MCAR-BLOCK", "MAR"]
    rates: [0.0, 0.1, 0.2, 0.3]
    seeds: [42, 123, 456, 789, 999]

  splits:
    train_years: 3
    calibrate_months: 6
    test_months: 6
    roll_forward_months: 6
    purge_days: 5

  evaluation:
    n_bins_ece: 10
    metrics: ["brier", "ece", "roc_auc"]